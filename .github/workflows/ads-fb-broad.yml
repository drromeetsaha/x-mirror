name: Ads Facebook broad targeting

# Makes the paused Facebook v6 ad set broad: India, 21-55, no interests
# (ads_fb_broad.py). Started by hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Broad targeting
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
        run: python ads_fb_broad.py
